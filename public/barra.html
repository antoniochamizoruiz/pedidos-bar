<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Barra</title>
<link rel="stylesheet" href="/estilos.css">
</head>
<body>
<header class="bar-head">
  <h1>Pedidos de barra</h1>
  <div class="bar-tools">
    <span class="live" id="live" role="status"><span class="dot"></span><span id="live-text">Conectando…</span></span>
    <button class="btn btn-small" id="sound" type="button" aria-pressed="false">Activar aviso sonoro</button>
    <a class="btn btn-small" href="/cierre">Cierre de caja</a>
    <a class="btn btn-small" href="/qr">Códigos QR</a>
  </div>
</header>
<div class="wrap" id="msg-wrap" hidden><div class="error" id="msg" role="alert"></div></div>
<main class="board" id="board" aria-label="Pedidos activos"></main>
<script src="/barra.js"></script>
</body>
</html>
