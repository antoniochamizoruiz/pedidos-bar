<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Códigos QR de las mesas</title>
<link rel="stylesheet" href="/estilos.css">
</head>
<body>
<div class="wrap">
  <div class="qr-controls no-print">
    <div class="field">
      <label for="base">Dirección pública de la web</label>
      <input id="base" type="url" inputmode="url" autocomplete="off" placeholder="https://pedidos.mibar.es">
    </div>
    <button class="btn btn-primary" id="print" type="button">Imprimir</button>
    <a class="btn" href="/barra">Volver a barra</a>
  </div>
  <p class="hint no-print" id="hint">Escribe la dirección con la que los clientes entrarán desde el móvil. Los códigos se actualizan solos. Antes de imprimir, escanea uno con tu teléfono para comprobarlo.</p>
  <div class="error" id="err" role="alert" hidden></div>
  <main class="qr-grid" id="grid"></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/qr.js"></script>
</body>
</html>
